version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sfs_postgres
    environment:
      POSTGRES_USER: sfsuser
      POSTGRES_PASSWORD: sfspassword
      POSTGRES_DB: sfsdb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sfsuser -d sfsdb']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sfs_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # MinIO Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 20s
      retries: 3

  # Creates the default bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: sfs_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/sfs-bucket --ignore-existing;
      mc anonymous set none local/sfs-bucket;
      echo 'Bucket created';
      "

volumes:
  postgres_data:
  minio_data:
